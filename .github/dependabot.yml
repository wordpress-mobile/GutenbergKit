version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      groups:
          # The editor exposes @wordpress packages on window.wp as single
          # instances, so they must move together like a Gutenberg release.
          # Bumping them one at a time leaves mismatched ranges that nest
          # duplicate copies.
          #
          # Scoped to production dependencies, matching `make
          # check-wp-packages`: dev tooling (eslint-plugin, env,
          # prettier-config, dependency-extraction-webpack-plugin) never
          # reaches the bundle, and because Dependabot ships a group
          # atomically, a breaking tooling major would hold back every
          # runtime bump alongside it.
          wordpress-packages:
              patterns: ['@wordpress/*']
              dependency-type: 'production'
      ignore:
          - dependency-name: 'eslint' # eslint@>=9.x.x blocked by https://github.com/WordPress/gutenberg/issues/64782
            update-types: ['version-update:semver-major']
          - dependency-name: 'react' # react@>=19.x.x blocked by https://github.com/WordPress/gutenberg/issues/71336
            update-types: ['version-update:semver-major']
          - dependency-name: 'react-dom' # react@>=19.x.x blocked by https://github.com/WordPress/gutenberg/issues/71336
            update-types: ['version-update:semver-major']
          - dependency-name: 'jquery' # jquery@>=4.x.x blocked by https://core.trac.wordpress.org/ticket/60478
            update-types: ['version-update:semver-major']
          - dependency-name: 'eslint-plugin-react-refresh' # eslint-plugin-react-refresh@>=0.5.x requires eslint@>=9.x.x, blocked by https://github.com/WordPress/gutenberg/issues/64782
            update-types: ['version-update:semver-minor']

    - package-ecosystem: 'bundler'
      directory: '/'
      schedule:
          interval: 'daily'
      groups:
          ruby-minor-and-patch:
              update-types: ['minor', 'patch']
      open-pull-requests-limit: 5
