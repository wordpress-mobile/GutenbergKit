version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      ignore:
          - dependency-name: 'eslint' # eslint@>=9.x.x blocked by https://github.com/WordPress/gutenberg/issues/64782
            update-types: ['version-update:semver-major']
          - dependency-name: 'react' # react@>=19.x.x blocked by https://github.com/WordPress/gutenberg/issues/71336
            update-types: ['version-update:semver-major']
          - dependency-name: 'react-dom' # react@>=19.x.x blocked by https://github.com/WordPress/gutenberg/issues/71336
            update-types: ['version-update:semver-major']
          - dependency-name: 'jquery' # jquery@>=4.x.x blocked by https://core.trac.wordpress.org/ticket/60478
            update-types: ['version-update:semver-major']
          - dependency-name: 'eslint-plugin-react-refresh' # eslint-plugin-react-refresh@>=0.5.x requires eslint@>=9.x.x, blocked by https://github.com/WordPress/gutenberg/issues/64782
            update-types: ['version-update:semver-minor']

    - package-ecosystem: 'bundler'
      directory: '/'
      schedule:
          interval: 'daily'
      groups:
          ruby-minor-and-patch:
              update-types: ['minor', 'patch']
      open-pull-requests-limit: 5

    - package-ecosystem: 'gradle'
      directory: '/android'
      schedule:
          interval: 'weekly'
      groups:
          gradle-minor-and-patch:
              update-types: ['minor', 'patch']
      open-pull-requests-limit: 5
      ignore:
          # The Android Gradle Plugin and Kotlin must match WordPress-Android
          # exactly, not track their own latest release. WordPress-Android
          # includes this project as a composite build, and Gradle refuses to
          # run one that spans two AGP versions; for Kotlin, the newer plugin
          # silently wins the classpath for both halves of that build. The
          # `Android toolchain sync` workflow watches WordPress-Android and
          # opens an issue when either drifts.
          - dependency-name: 'com.android.application'
          - dependency-name: 'com.android.library'
          - dependency-name: 'org.jetbrains.kotlin*'
          # Published to a private S3 Maven repo with a versioning scheme
          # Dependabot cannot resolve.
          - dependency-name: 'rs.wordpress.api:android'
          - dependency-name: 'com.automattic.android.publish-to-s3'
