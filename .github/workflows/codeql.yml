name: 'CodeQL'

on:
    workflow_dispatch:
    push:
        branches: [trunk]
    pull_request:
        branches: [trunk]
    schedule:
        - cron: '0 6 * * 1' # Weekly on Monday at 6am UTC

permissions:
    security-events: write
    contents: read

jobs:
    analyze-interpreted:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 15

        strategy:
            fail-fast: false
            matrix:
                language: [actions, java-kotlin, javascript-typescript]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: ${{ matrix.language }}

            # The :Gutenberg Gradle build generates `SupportedLocales.kt` from
            # `src/main/assets/supported-locales.json`, which is emitted by the
            # JS build's Vite plugin. Without it, Autobuild fails before any
            # Kotlin sources are extracted.
            - name: Set up Node.js
              if: matrix.language == 'java-kotlin'
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Populate Android assets via JS build
              if: matrix.language == 'java-kotlin'
              run: make build

            - name: Autobuild
              uses: github/codeql-action/autobuild@v3

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: '/language:${{ matrix.language }}'

    analyze-swift:
        name: Analyze (swift)
        runs-on: macos-15
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Select Xcode
              run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: swift

            - name: Build Swift package
              run: swift build --target GutenbergKit --target GutenbergKitHTTP

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: '/language:swift'
