name: 'CodeQL'

on:
    workflow_dispatch:
    push:
        branches: [trunk]
    pull_request:
        branches: [trunk]
    schedule:
        - cron: '0 6 * * 1' # Weekly on Monday at 6am UTC

permissions:
    security-events: write
    contents: read

jobs:
    analyze-interpreted:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 15

        strategy:
            fail-fast: false
            matrix:
                language: [actions, javascript-typescript]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:${{ matrix.language }}'

    analyze-kotlin:
        name: Analyze (java-kotlin)
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: java-kotlin

            # The :Gutenberg Gradle build generates `SupportedLocales.kt` from
            # `src/main/assets/supported-locales.json`, which is emitted by the
            # JS build's Vite plugin. Without it, the Gradle build fails before
            # any Kotlin sources are extracted.
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Populate Android assets via JS build
              run: make build

            - name: Build Android project
              run: cd android && ./gradlew compileDebugSources compileDebugUnitTestSources

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:java-kotlin'

    analyze-swift:
        name: Analyze (swift)
        runs-on: macos-15
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Select Xcode
              run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

            - name: Cache SPM dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/Library/Caches/org.swift.swiftpm/repositories
                  key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
                  restore-keys: |
                      spm-${{ runner.os }}-

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: swift

            - name: Build Swift package
              run: swift build

            - name: Build Demo app
              run: xcodebuild build -project ios/Demo-iOS/Gutenberg.xcodeproj -scheme Gutenberg -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:swift'
