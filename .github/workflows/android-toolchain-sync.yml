name: Android Toolchain Sync

# WordPress-Android includes this project as a composite build when a developer
# sets `localGutenbergKitPath`. That build breaks or misbehaves when the two
# repositories' AGP or Kotlin versions differ, or their Gradle majors do, since
# WordPress-Android's Gradle runs this repository's build scripts. Dependabot
# cannot keep these aligned — it upgrades toward the newest release, while these
# versions have to follow WordPress-Android — so this job watches for the drift
# and files an issue.

on:
    schedule:
        - cron: '0 6 * * 1' # Weekly on Monday at 6am UTC
    workflow_dispatch:

# Overlapping runs could each find no issue and open duplicates.
concurrency:
    group: ${{ github.workflow }}

jobs:
    compare:
        name: Compare with WordPress-Android
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v4

            - name: Compare toolchain versions and report drift
              uses: actions/github-script@v7
              with:
                  script: |
                      const { default: reportToolchainDrift } = await import(
                          `${process.env.GITHUB_WORKSPACE}/.github/scripts/android-toolchain-sync.js`
                      );
                      await reportToolchainDrift({ github, context, core });
