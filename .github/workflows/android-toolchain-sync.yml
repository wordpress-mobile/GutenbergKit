name: Android Toolchain Sync

# WordPress-Android includes this project as a composite build when a developer
# sets `localGutenbergKitPath`. Gradle refuses to run a composite build that
# spans two Android Gradle Plugin versions, so an AGP bump there breaks local
# builds here until this repository follows. Dependabot cannot do that work —
# it upgrades toward the newest release, while these versions have to match
# WordPress-Android — so this job watches for the drift and files an issue.

on:
    schedule:
        - cron: '0 6 * * 1' # Weekly on Monday at 6am UTC
    workflow_dispatch:

permissions:
    issues: write

jobs:
    compare:
        name: Compare with WordPress-Android
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Compare toolchain versions and report drift
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs/promises');

                      const UPSTREAM = 'wordpress-mobile/WordPress-Android';
                      const UPSTREAM_REF = 'trunk';
                      const ISSUE_TITLE = 'Android toolchain drift with WordPress-Android';

                      // `local` and `upstream` name the same version in each
                      // repository's catalog; the keys differ between them.
                      // `blocking` marks versions that break the composite
                      // build outright, as opposed to ones worth reporting.
                      const TRACKED = [
                          { name: 'AGP', local: 'agp', upstream: 'agp', blocking: true },
                          { name: 'Kotlin', local: 'kotlin', upstream: 'kotlin-main', blocking: true },
                      ];

                      const upstreamUrl = (path) =>
                          `https://raw.githubusercontent.com/${UPSTREAM}/${UPSTREAM_REF}/${path}`;

                      async function fetchUpstream(path) {
                          const response = await fetch(upstreamUrl(path));
                          if (!response.ok) {
                              throw new Error(
                                  `Could not read ${path} from ${UPSTREAM}@${UPSTREAM_REF}: ` +
                                      `${response.status} ${response.statusText}`
                              );
                          }
                          return response.text();
                      }

                      // Confine lookups to `[versions]` so a key is never
                      // matched against a `version.ref` in `[plugins]`.
                      function readCatalogVersion(toml, key, source) {
                          const lines = toml.split('\n');
                          const start = lines.findIndex((line) => line.trim() === '[versions]');
                          if (start === -1) {
                              throw new Error(`No [versions] section in ${source}.`);
                          }
                          for (const line of lines.slice(start + 1)) {
                              if (line.trim().startsWith('[')) break;
                              const match = line.match(/^\s*([\w.-]+)\s*=\s*['"]([^'"]+)['"]/);
                              if (match && match[1] === key) return match[2];
                          }
                          throw new Error(
                              `No '${key}' entry under [versions] in ${source}. ` +
                                  'The catalog key was probably renamed — update TRACKED in this workflow.'
                          );
                      }

                      function readWrapperVersion(properties, source) {
                          const match = properties.match(/gradle-(\d+(?:\.\d+)+)-(?:all|bin)\.zip/);
                          if (!match) {
                              throw new Error(`No distributionUrl version in ${source}.`);
                          }
                          return match[1];
                      }

                      const localCatalog = await fs.readFile('android/gradle/libs.versions.toml', 'utf8');
                      const upstreamCatalog = await fetchUpstream('gradle/libs.versions.toml');
                      const localWrapper = await fs.readFile(
                          'android/gradle/wrapper/gradle-wrapper.properties',
                          'utf8'
                      );
                      const upstreamWrapper = await fetchUpstream('gradle/wrapper/gradle-wrapper.properties');

                      const rows = TRACKED.map((entry) => ({
                          name: entry.name,
                          blocking: entry.blocking,
                          ours: readCatalogVersion(localCatalog, entry.local, 'GutenbergKit'),
                          theirs: readCatalogVersion(upstreamCatalog, entry.upstream, UPSTREAM),
                      }));

                      // Gradle itself is reported but never blocking: a
                      // composite build runs on the root build's wrapper, so
                      // this only matters if GutenbergKit starts requiring a
                      // newer Gradle than WordPress-Android provides.
                      rows.push({
                          name: 'Gradle',
                          blocking: false,
                          ours: readWrapperVersion(localWrapper, 'GutenbergKit'),
                          theirs: readWrapperVersion(upstreamWrapper, UPSTREAM),
                      });

                      for (const row of rows) {
                          core.info(`${row.name}: ours=${row.ours} theirs=${row.theirs}`);
                      }

                      const drifted = rows.filter((row) => row.blocking && row.ours !== row.theirs);

                      const { owner, repo } = context.repo;
                      const openIssues = await github.paginate(github.rest.issues.listForRepo, {
                          owner,
                          repo,
                          state: 'open',
                          per_page: 100,
                      });
                      const existing = openIssues.find(
                          (issue) => !issue.pull_request && issue.title === ISSUE_TITLE
                      );

                      if (drifted.length === 0) {
                          core.info('Toolchain versions are in sync.');
                          if (existing) {
                              await github.rest.issues.createComment({
                                  owner,
                                  repo,
                                  issue_number: existing.number,
                                  body: 'Versions are back in sync with WordPress-Android. Closing.',
                              });
                              await github.rest.issues.update({
                                  owner,
                                  repo,
                                  issue_number: existing.number,
                                  state: 'closed',
                              });
                          }
                          return;
                      }

                      const table = [
                          '| Version | GutenbergKit | WordPress-Android | |',
                          '| --- | --- | --- | --- |',
                          ...rows.map((row) => {
                              const status = row.ours === row.theirs
                                  ? 'in sync'
                                  : row.blocking ? '**drifted**' : 'differs (not blocking)';
                              return `| ${row.name} | \`${row.ours}\` | \`${row.theirs}\` | ${status} |`;
                          }),
                      ].join('\n');

                      const agp = rows.find((row) => row.name === 'AGP');
                      const body = [
                          `[${UPSTREAM}](https://github.com/${UPSTREAM}/blob/${UPSTREAM_REF}/gradle/libs.versions.toml)` +
                              ' has moved ahead of this repository.',
                          '',
                          table,
                          '',
                          'Until these match, `./gradlew` in WordPress-Android fails during configuration for',
                          'anyone who sets `localGutenbergKitPath` in `local-builds.gradle`:',
                          '',
                          '```',
                          `Using multiple versions of the Android Gradle Plugin [${agp.theirs}, ${agp.ours}] across Gradle builds is not allowed.`,
                          'Affected builds: [:, :android].',
                          '```',
                          '',
                          'Update `android/gradle/libs.versions.toml` to the WordPress-Android versions above.',
                          'Note that AGP upgrades have needed source changes beyond the version bump.',
                          '',
                          `<sub>Opened by [\`${context.workflow}\`](https://github.com/${owner}/${repo}/blob/trunk/.github/workflows/android-toolchain-sync.yml).</sub>`,
                      ].join('\n');

                      if (existing) {
                          // GitHub stores issue bodies with CRLF line endings.
                          if ((existing.body ?? '').replace(/\r\n/g, '\n') === body) {
                              core.info(`Issue #${existing.number} is already up to date.`);
                              return;
                          }
                          await github.rest.issues.update({
                              owner,
                              repo,
                              issue_number: existing.number,
                              body,
                          });
                          core.info(`Updated issue #${existing.number}.`);
                          return;
                      }

                      const created = await github.rest.issues.create({
                          owner,
                          repo,
                          title: ISSUE_TITLE,
                          body,
                          labels: ['Android', '[Type] Build Tooling'],
                      });
                      core.info(`Opened issue #${created.data.number}.`);
