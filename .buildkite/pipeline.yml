agents:
    queue: mac

env:
    IMAGE_ID: $IMAGE_ID

steps:
    - label: ':javascript: Test JavaScript'
      command: make test-js
      plugins: &plugins
        - $CI_TOOLKIT_PLUGIN
        - $NVM_PLUGIN

    - label: ':swift: Test Swift Package'
      command: GUTENBERGKIT_SWIFT_USE_LOCAL_RESOURCES=1 make test-swift-package
      plugins: *plugins

    - label: ':xcode: Publish XCFramework'
      key: publish-xcframework
      command: make publish-resources-xcframework
      plugins: *plugins
      artifact_paths:
        - 'build/*.xcframework.zip'
        - 'build/*.checksum.txt'

    - label: ':swift: Test Swift Package with XCFramework'
      depends_on: publish-xcframework
      command: |
        buildkite-agent artifact download build/*.checksum.txt .
        make update-xcframework-reference
        make test-swift-package-no-build
      plugins: *plugins
