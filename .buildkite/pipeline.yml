agents:
    queue: mac

env:
    IMAGE_ID: $IMAGE_ID

# TEMPORARY soak pipeline — do not merge.
# Runs only the React build and the Web E2E step, the latter with
# `parallelism` so a single build produces many independent E2E runs
# (each against a freshly provisioned wp-env). Used to confirm the
# wp-env warm-up flakiness fixed on `mokagio/fix-e2e-wp-env-flaky` is
# gone. Revert to the full pipeline before this branch could ever merge.
steps:
    - label: ':react: Build React App'
      key: build-react
      command: |
          set -euo pipefail
          make prep-translations STRICT_L10N=1 > prep-translations.log 2>&1 &
          PREP_PID=$$!
          make npm-dependencies
          PREP_STATUS=0
          wait $$PREP_PID || PREP_STATUS=$$?
          echo "--- :earth_americas: prep-translations (ran in parallel with npm ci)"
          cat prep-translations.log
          rm -f prep-translations.log
          if [ "$$PREP_STATUS" -ne 0 ]; then
              exit "$$PREP_STATUS"
          fi
          make build REFRESH_JS_BUILD=1
          tar -czf dist.tar.gz dist/
          buildkite-agent artifact upload dist.tar.gz
      plugins: &plugins
          - $CI_TOOLKIT_PLUGIN
          - $NVM_PLUGIN

    - label: ':performing_arts: Test Web E2E'
      key: test-web-e2e
      depends_on: build-react
      parallelism: 10
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          echo "--- :wordpress: Starting wp-env"
          make wp-env-start
          echo "--- :performing_arts: Running E2E tests"
          make test-e2e
      plugins: *plugins
