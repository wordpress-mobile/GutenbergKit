agents:
    queue: mac

env:
    IMAGE_ID: $IMAGE_ID

steps:
    - label: ':react: Build React App'
      key: build-react
      command: |
          make build REFRESH_L10N=1 REFRESH_JS_BUILD=1 STRICT_L10N=1
          tar -czf dist.tar.gz dist/
          buildkite-agent artifact upload dist.tar.gz
      plugins: &plugins
          - $CI_TOOLKIT_PLUGIN
          - $NVM_PLUGIN

    - label: ':eslint: Lint React App'
      command: make lint-js
      plugins: *plugins

    - label: ':javascript: Test JavaScript'
      command: make test-js
      plugins: *plugins

    - label: ':performing_arts: Test Web E2E'
      depends_on: build-react
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          echo "--- :docker: Starting wp-env"
          make wp-env-start
          echo "--- :mag: Verifying wp-env state"
          make wp-env-cli CMD="plugin list"
          echo "Checking REST API routes..."
          curl -s http://localhost:8888/wp-json/ | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const routes = Object.keys(data.routes || {}).filter(r => r.includes('block-editor'));
            if (routes.length) { console.log('wp-block-editor routes found:', routes); }
            else { console.log('WARNING: No wp-block-editor routes found!'); }
          "
          CREDS_FILE=".wp-env.credentials.json"
          AUTH_HEADER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$CREDS_FILE','utf8')).authHeader)")
          echo "Testing editor settings endpoint..."
          curl -v -H "Authorization: $AUTH_HEADER" http://localhost:8888/wp-json/wp-block-editor/v1/settings 2>&1 | head -30
          echo "--- :performing_arts: Running E2E tests in Playwright container"
          docker run --rm \
            --userns=host \
            --network host \
            -v "$(pwd):/work" \
            -w /work \
            -e CI=true \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -c "npm ci && npx playwright install chromium && npx playwright test"
      agents:
          queue: default
      plugins: *plugins

    - label: ':android: Publish Android Library'
      depends_on: build-react
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          rm -rf ./android/Gutenberg/src/main/assets/
          cp -r ./dist/. ./android/Gutenberg/src/main/assets
          echo "--- :android: Publishing Android Library"
          ./android/gradlew -p ./android :gutenberg:prepareToPublishToS3 $(prepare_to_publish_to_s3_params) :gutenberg:publish
      agents:
          queue: android
      plugins: *plugins

    - label: ':android: Test Android Library'
      command: make test-android
      agents:
          queue: android
      plugins: *plugins

    - label: ':swift: Test Swift Package'
      command: swift test
      plugins: *plugins

    - label: ':ios: Test iOS E2E'
      depends_on: build-react
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          make test-ios-e2e
      plugins: *plugins
