agents:
    queue: mac

env:
    IMAGE_ID: $IMAGE_ID

steps:
    - label: ':react: Build React App'
      key: build-react
      command: |
          make build REFRESH_L10N=1 REFRESH_JS_BUILD=1 STRICT_L10N=1
          tar -czf dist.tar.gz dist/
          buildkite-agent artifact upload dist.tar.gz
      plugins: &plugins
          - $CI_TOOLKIT_PLUGIN
          - $NVM_PLUGIN

    - label: ':eslint: Lint React App'
      command: make lint-js
      plugins: *plugins

    - label: ':javascript: Test JavaScript'
      command: make test-js
      plugins: *plugins

    - label: ':performing_arts: Test Web E2E'
      command: |
          echo "--- :mag: Agent diagnostics"
          echo "User: $(whoami) (uid=$(id -u), gid=$(id -g))"
          echo "Groups: $(groups)"
          id
          echo ""
          echo "--- :lock: sudo check"
          sudo -n true 2>&1 && echo "Passwordless sudo: YES" || echo "Passwordless sudo: NO"
          echo ""
          echo "--- :docker: Docker check"
          which docker 2>&1 || echo "which docker: not found"
          docker --version 2>&1 || echo "docker --version: failed"
          docker info 2>&1 | head -20 || echo "docker info: failed"
          docker ps 2>&1 || echo "docker ps: failed"
          echo ""
          echo "--- :package: Package manager check"
          which apt-get 2>&1 || echo "apt-get: not found"
          apt-get --version 2>&1 | head -1 || echo "apt-get --version: failed"
          dpkg -l libatk1.0-0 2>&1 || echo "libatk1.0-0: not installed"
          echo ""
          echo "--- :chromium: Playwright check"
          npx playwright install --dry-run chromium 2>&1 || echo "playwright dry-run: failed"
      agents:
          queue: default
      plugins: *plugins

    - label: ':android: Publish Android Library'
      depends_on: build-react
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          rm -rf ./android/Gutenberg/src/main/assets/
          cp -r ./dist/. ./android/Gutenberg/src/main/assets
          echo "--- :android: Publishing Android Library"
          ./android/gradlew -p ./android :gutenberg:prepareToPublishToS3 $(prepare_to_publish_to_s3_params) :gutenberg:publish
      agents:
          queue: android
      plugins: *plugins

    - label: ':android: Test Android Library'
      command: make test-android
      agents:
          queue: android
      plugins: *plugins

    - label: ':swift: Test Swift Package'
      command: swift test
      plugins: *plugins

    - label: ':ios: Test iOS E2E'
      depends_on: build-react
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          make test-ios-e2e
      plugins: *plugins
