agents:
    queue: mac

env:
    IMAGE_ID: $IMAGE_ID

steps:
    - label: ':react: Build React App'
      key: build-react
      command: |
          make build REFRESH_L10N=1 REFRESH_JS_BUILD=1 STRICT_L10N=1
          tar -czf dist.tar.gz dist/
          buildkite-agent artifact upload dist.tar.gz
      plugins: &plugins
          - $CI_TOOLKIT_PLUGIN
          - $NVM_PLUGIN

    - label: ':eslint: Lint React App'
      command: make lint-js
      plugins: *plugins

    - label: ':javascript: Test JavaScript'
      command: make test-js
      plugins: *plugins

    - label: ':performing_arts: Test Web E2E'
      command: |
          echo "--- :docker: Checking Docker availability"
          echo "which docker: $(which docker 2>&1 || echo 'not found')"
          echo "PATH: $PATH"
          command -v docker && echo "docker found via command -v" || echo "docker NOT found via command -v"
          type docker 2>&1 || echo "type docker: not found"
          ls -la /usr/local/bin/docker 2>/dev/null || echo "/usr/local/bin/docker: not found"
          ls -la /opt/homebrew/bin/docker 2>/dev/null || echo "/opt/homebrew/bin/docker: not found"
          ls -la /Applications/Docker.app 2>/dev/null || echo "/Applications/Docker.app: not found"
          find /usr/local -name "docker" -type f 2>/dev/null || echo "No docker binary found under /usr/local"
          brew list --formula 2>/dev/null | grep -i docker || echo "No docker formula installed via Homebrew"
          docker --version 2>&1 || echo "docker --version: failed"
          docker compose version 2>&1 || echo "docker compose version: failed"
          docker info 2>&1 || echo "docker info: failed"
      plugins: *plugins

    - label: ':android: Publish Android Library'
      depends_on: build-react
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          rm -rf ./android/Gutenberg/src/main/assets/
          cp -r ./dist/. ./android/Gutenberg/src/main/assets
          echo "--- :android: Publishing Android Library"
          ./android/gradlew -p ./android :gutenberg:prepareToPublishToS3 $(prepare_to_publish_to_s3_params) :gutenberg:publish
      agents:
          queue: android
      plugins: *plugins

    - label: ':android: Test Android Library'
      command: make test-android
      agents:
          queue: android
      plugins: *plugins

    - label: ':swift: Test Swift Package'
      command: swift test
      plugins: *plugins

    - label: ':ios: Test iOS E2E'
      depends_on: build-react
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          make test-ios-e2e
      plugins: *plugins
