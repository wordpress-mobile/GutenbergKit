agents:
    queue: mac

env:
    IMAGE_ID: $IMAGE_ID
    # electron ships a ~100 MB prebuilt binary via a postinstall download
    # that no CI step ever runs (it only backs react-devtools' `dev:tools`).
    # The download is flaky from CI, so skip it -- see the Test Web E2E job.
    ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

# Each step carries one emoji naming the platform it builds, tests, or ships —
# :javascript: for the web editor (there is no clean web glyph), :ios:, or
# :android: — and a verb-first, title-case label that stands on its own.
# Where a step runs or mirrors a make target, key it by that target's name.
#
# Labels become GitHub check names, and the trunk ruleset requires several by
# name, so renaming a label needs a matching ruleset update.
steps:
    - label: ':javascript: Build Web Bundle'
      key: build
      command: |
          # Fail fast if any step (including the backgrounded
          # `fetch-translations`, surfaced via `wait`) returns non-zero,
          # rather than continuing into `make build` with partial inputs.
          set -euo pipefail
          # `fetch-translations` is pure network I/O and no longer depends
          # on `node_modules` (uses Node's built-in `fetch`), so it can run
          # in parallel with `npm ci`. Vite reads `src/translations/` when
          # it emits locale bundles, so we wait for the fetch to complete
          # before invoking `make build`.
          #
          # Background output is redirected to a logfile and replayed
          # after `wait` returns so its `--- :section:` markers don't
          # interleave with `npm ci`'s and confuse Buildkite log folding.
          # The replay happens unconditionally so a failed fetch surfaces
          # its log before `set -e` aborts the script.
          make fetch-translations STRICT_L10N=1 > fetch-translations.log 2>&1 &
          FETCH_PID=$$!
          make install-web-deps
          FETCH_STATUS=0
          wait $$FETCH_PID || FETCH_STATUS=$$?
          echo "--- :earth_americas: fetch-translations (ran in parallel with npm ci)"
          cat fetch-translations.log
          rm -f fetch-translations.log
          if [ "$$FETCH_STATUS" -ne 0 ]; then
              exit "$$FETCH_STATUS"
          fi
          make build REFRESH_JS_BUILD=1
          tar -czf dist.tar.gz dist/
          buildkite-agent artifact upload dist.tar.gz
      plugins: &plugins
          - $CI_TOOLKIT_PLUGIN
          - $NVM_PLUGIN

    - label: ':ios: Validate Swift Release ${NEW_VERSION:-(no version)}'
      key: validate-release
      if: build.env("NEW_VERSION") != null && build.branch == "trunk" && build.pull_request.id == null
      command: |
          install_gems
          bundle exec fastlane validate "version:$NEW_VERSION"
      plugins: *plugins

    - label: ':javascript: Lint JavaScript'
      key: lint-web
      command: make lint-web
      plugins: *plugins

    - label: ':javascript: Check @wordpress Package Versions'
      key: check-wp-packages
      command: make check-wp-packages
      plugins: *plugins

    - label: ':javascript: Test JavaScript'
      key: test-web-unit
      command: make test-web-unit
      plugins: *plugins

    - label: ':javascript: Test Web E2E'
      key: test-web-e2e
      depends_on: build
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          echo "--- :wordpress: Starting wp-env"
          make wp-env-start
          echo "--- :performing_arts: Running E2E tests"
          make test-web-e2e
      plugins: *plugins

    - label: ':android: Publish Android Library'
      depends_on: build
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          rm -rf ./android/Gutenberg/src/main/assets/
          cp -r ./dist/. ./android/Gutenberg/src/main/assets
          echo "--- :android: Publishing Android Library"
          .buildkite/publish-android-library.sh
      agents:
          queue: android
      plugins: *plugins

    - label: ':android: Lint Android'
      key: lint-android
      command: make lint-android
      agents:
          queue: android
      plugins: *plugins

    - label: ':ios: Lint Swift'
      key: lint-ios
      command: swiftlint
      agents:
          queue: linter

    - label: ':android: Test Android Library'
      key: test-android-library-unit
      depends_on: build
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          make test-android-library-unit
      agents:
          queue: android
      plugins: *plugins

    - label: ':ios: Test Swift Simulator'
      key: test-ios-library-simulator
      depends_on: build
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          make test-ios-library-simulator
      plugins: *plugins

    - label: ':ios: Test Swift Host'
      key: test-ios-library-host
      depends_on: build
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          make test-ios-library-host
      plugins: *plugins

    - label: ':ios: Build XCFramework'
      key: build-ios-resources-xcframework
      depends_on:
          - build
          - test-ios-library-host
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          install_gems
          bundle exec fastlane set_up_signing_release
          make build-ios-resources-xcframework
          bundle exec fastlane xcframework_sign
          ./package_xcframework.sh
      artifact_paths:
          - '*.xcframework.zip'
          - '*.xcframework.zip.checksum.txt'
      plugins: *plugins

    - label: ':ios: Publish XCFramework to S3'
      depends_on: build-ios-resources-xcframework
      # This step only covers per-commit trunk uploads keyed by the commit
      # SHA. Releases are handled by `:ios: Publish Swift Release` (gated
      # on `NEW_VERSION`), and tag pushes from that step trigger a separate
      # tag build whose iOS upload would just duplicate the release step's —
      # the `build.tag == null` clause skips it. Android publish on tag
      # builds is still load-bearing (produces the `vX.Y.Z` Maven artifact)
      # and intentionally not gated here.
      if: build.env("NEW_VERSION") == null && build.tag == null && build.pull_request.id == null
      command: |
          buildkite-agent artifact download '*.xcframework.zip' .
          buildkite-agent artifact download '*.xcframework.zip.checksum.txt' .
          install_gems
          bundle exec fastlane publish_to_s3 version:$BUILDKITE_COMMIT
      plugins: *plugins

    - label: ':ios: Publish PR XCFramework'
      depends_on: build-ios-resources-xcframework
      if: build.pull_request.id != null
      command: .buildkite/publish-pr-xcframework.sh
      plugins: *plugins

    - label: ':ios: Publish Swift Release ${NEW_VERSION:-(Error: No version found!)}'
      depends_on:
          - validate-release
          - build-ios-resources-xcframework
          - test-ios-library-simulator
          - lint-web
          - lint-ios
          - check-wp-packages
          - test-web-unit
          - test-web-e2e
          - test-ios-app-e2e
      if: build.env("NEW_VERSION") != null && build.branch == "trunk" && build.pull_request.id == null
      # Pass NEW_VERSION as an argument: build-level env vars set when
      # triggering aren't exposed to job runtime shells on `queue: mac`, but
      # `$NEW_VERSION` here gets YAML-interpolated at pipeline-upload time
      # so the literal version lands in the command line.
      command: .buildkite/release.sh "$NEW_VERSION"
      plugins: *plugins

    - label: ':ios: Test iOS App E2E'
      key: test-ios-app-e2e
      depends_on: build
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          make test-ios-app-e2e
      plugins: *plugins

    - label: ':android: Test Android App E2E'
      key: test-android-app-e2e
      depends_on: build
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          echo "--- :robot_face: Starting Android emulator"
          start-android-emulator \
              --system-image "system-images;android-34;google_apis;arm64-v8a" \
              --device "pixel_5"
          echo "--- :android: Running Android instrumented tests"
          make test-android-app-e2e
      agents:
          queue: mac-metal
      plugins: *plugins
      artifact_paths:
          - 'android/app/build/reports/androidTests/connected/**/*'
          - 'android/app/build/outputs/androidTest-results/connected/**/*'
          - 'android/app/build/outputs/connected_android_test_additional_output/**/*'

    - label: ':android: Test Android Library E2E'
      key: test-android-library-e2e
      depends_on: build
      command: |
          buildkite-agent artifact download dist.tar.gz .
          tar -xzf dist.tar.gz
          echo "--- :robot_face: Starting Android emulator"
          start-android-emulator \
              --system-image "system-images;android-34;google_apis;arm64-v8a" \
              --device "pixel_5"
          make test-android-library-e2e
      agents:
          queue: mac-metal
      plugins: *plugins
      artifact_paths:
          - 'android/Gutenberg/build/reports/androidTests/connected/**/*'
          - 'android/Gutenberg/build/outputs/androidTest-results/connected/**/*'
          - 'android/Gutenberg/build/outputs/buildkite-logs/**/*'
          - 'android/Gutenberg/build/outputs/connected_android_test_additional_output/**/*'

    - label: ':ios: Clean Up `pr-build/*` Branches for Closed PRs'
      if: build.branch == "trunk"
      command: .buildkite/cleanup-pr-build-branches.sh
      plugins: *plugins
